<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в D&D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Кнопка Назад -->
    <a href="index.html" style="position: absolute; top: 20px; left: 20px; text-decoration: none;">
        <button style="width: auto; padding: 10px 20px; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555; font-size: 16px; cursor: pointer; border-radius: 6px;">← Назад</button>
    </a>

    <div class="main-container">
        <h1>Вход</h1>
        
        <div class="card">
            <div class="stats">
                <label>Логин: <input type="text" id="login-login" placeholder="Ваш логин"></label>
                <label>Пароль: <input type="password" id="login-pass" placeholder="Ваш пароль"></label>
            </div>
            
            <button id="login-btn">Войти</button>
            <p id="login-status"></p>
            
            <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('login-btn').addEventListener('click', async () => {
            const login = document.getElementById('login-login').value.trim();
            const pass = document.getElementById('login-pass').value;
            const status = document.getElementById('login-status');

            if (!login || !pass) {
                status.textContent = 'Заполните все поля!';
                status.style.color = 'red';
                return;
            }

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login, pass })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('currentUser', login);
                localStorage.setItem('isMaster', data.isMaster); // Запоминаем роль
                window.location.href = 'player.html';
            } else {
                status.textContent = data.error || 'Ошибка';
                status.style.color = 'red';
            }
        });
    </script>
</body>
</html>

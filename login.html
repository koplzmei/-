<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в D&D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Кнопка Назад -->
    <a href="index.html" style="position: absolute; top: 20px; left: 20px; text-decoration: none;">
        <button style="width: auto; padding: 10px 20px; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555; font-size: 16px; cursor: pointer; border-radius: 6px;">← Назад</button>
    </a>

    <div class="main-container">
        <h1>Вход</h1>
        
        <div class="card">
            <div class="stats">
                <label>Логин: <input type="text" id="login-login" placeholder="Ваш логин"></label>
                <label>Пароль: <input type="password" id="login-pass" placeholder="Ваш пароль"></label>
            </div>
            
            <button id="login-btn">Войти</button>
            <p id="login-status"></p>
            
            <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </p>
        </div>
    </div>

    <script>
        // ВСТАВЬТЕ СЮДА ССЫЛКУ НА ВАШУ БАЗУ FIREBASE (без слэша в конце)
        const DB_URL = 'https://ВАШ-ПРОЕКТ-default-rtdb.europe-west1.firebasedatabase.app'.replace(/\/$/, '');

        function makeKey(str) {
            return Array.from(new TextEncoder().encode(str.toLowerCase().trim()))
                .map(b => b.toString(16).padStart(2, '0')).join('');
        }

        document.getElementById('login-btn').addEventListener('click', async () => {
            const login = document.getElementById('login-login').value.trim();
            const pass = document.getElementById('login-pass').value;
            const status = document.getElementById('login-status');

            if (!login || !pass) {
                status.textContent = 'Заполните все поля!';
                status.style.color = 'red';
                return;
            }

            if (DB_URL.includes('ВАШ-ПРОЕКТ')) {
                status.textContent = 'Не указана ссылка DB_URL в коде!';
                status.style.color = 'red';
                return;
            }

            try {
                const response = await fetch(`${DB_URL}/users/${makeKey(login)}.json`);
                if (!response.ok) throw new Error('Ошибка базы данных');
                const user = await response.json();

                if (user && user.pass === pass) {
                    localStorage.setItem('currentUser', user.login);
                    localStorage.setItem('isMaster', Boolean(user.isMaster));
                    window.location.href = 'player.html';
                } else {
                    status.textContent = 'Неверный логин или пароль';
                    status.style.color = 'red';
                }
            } catch (err) {
                console.error(err);
                status.textContent = 'Ошибка соединения с базой';
                status.style.color = 'red';
            }
        });
    </script>
</body>
</html>

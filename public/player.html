<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои персонажи</title>
    <link rel="stylesheet" href="style.css">
    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body>
    <div style="position: absolute; top: 20px; right: 20px;">
        <button id="logout-btn" style="width: auto; padding: 10px 20px; background: #8b0000; color: white; border: none; font-size: 16px; border-radius: 6px; cursor: pointer;">Выйти</button>
    </div>

    <div class="main-container" style="max-width: 1000px;">
        <h1 id="page-title">Мои персонажи</h1>
        
        <div class="card" style="margin-bottom: 30px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0;">Создать нового персонажа</h2>
                <!-- Кнопка загрузки JSON -->
                <label style="cursor: pointer; background: #333; color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 16px; border: 1px solid #555; transition: 0.2s; display: flex; align-items: center; gap: 10px;" onmouseover="this.style.background='#444'" onmouseout="this.style.background='#333'">
                    📂 Загрузить карточку (JSON)
                    <input type="file" id="import-file" accept=".json" style="display: none;">
                </label>
            </div>
            
            <div class="stats" style="gap: 20px;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <label style="width: 80px; font-size: 18px;">Имя:</label>
                    <input type="text" id="char-name" placeholder="Имя персонажа" style="width: 300px; height: 40px; font-size: 18px;">
                </div>
                
                <div style="display: flex; gap: 40px; align-items: center; margin-top: 10px;">
                    <label style="display: flex; align-items: center; gap: 10px; font-size: 18px;">Уровень: <input type="number" id="char-level" value="1" readonly style="width: 80px; height: 40px; font-size: 18px; text-align: center; background: #1a1a1a; cursor: not-allowed;"></label>
                    <label style="display: flex; align-items: center; gap: 10px; font-size: 18px;">XP: <input type="number" id="char-xp" value="0" style="width: 100px; height: 40px; font-size: 18px; text-align: center;"></label>
                </div>

                <div style="border: 1px solid #444; padding: 25px; border-radius: 10px; margin-top: 10px; background: rgba(0,0,0,0.2);">
                    <p style="margin-bottom: 20px; color: #ffd700; font-weight: bold; font-size: 20px;">Характеристики</p>
                    
                    <div style="display: grid; grid-template-columns: 90px 120px 90px 120px; gap: 20px 20px; align-items: center; font-size: 18px;">
                        <label>ХП:</label>
                        <div style="display: flex; align-items: center; gap: 5px; width: 100%;">
                            <input type="number" id="char-hp" value="10" style="width: 50px; height: 40px; font-size: 18px; text-align: center;">
                            <span>/</span>
                            <input type="number" id="char-hp-max" value="10" style="width: 50px; height: 40px; font-size: 18px; text-align: center;">
                        </div>
                        <label>СИЛ:</label>
                        <input type="number" id="char-str" value="10" style="width: 100%; height: 40px; font-size: 18px; text-align: center; padding: 0 10px;">

                        <label>ЕН:</label>
                        <div style="display: flex; align-items: center; gap: 5px; width: 100%;">
                            <input type="number" id="char-en" value="10" style="width: 50px; height: 40px; font-size: 18px; text-align: center;">
                            <span>/</span>
                            <input type="number" id="char-en-max" value="10" style="width: 50px; height: 40px; font-size: 18px; text-align: center;">
                        </div>
                        <label>ЛОВ:</label>
                        <input type="number" id="char-dex" value="10" style="width: 100%; height: 40px; font-size: 18px; text-align: center; padding: 0 10px;">

                        <label>СТРЕС:</label>
                        <div style="display: flex; align-items: center; gap: 5px; width: 100%;">
                            <input type="number" id="char-stress" value="0" style="width: 50px; height: 40px; font-size: 18px; text-align: center;">
                            <span>/</span>
                            <input type="number" id="char-stress-max" value="10" style="width: 50px; height: 40px; font-size: 18px; text-align: center;">
                        </div>
                        <label>РАЗУМ:</label>
                        <input type="number" id="char-razum" value="10" style="width: 100%; height: 40px; font-size: 18px; text-align: center; padding: 0 10px;">
                        <div></div><div></div>
                    </div>
                </div>
            </div>
            
            <button id="save-btn" style="margin-top: 25px; height: 50px; font-size: 20px;">Создать карточку</button>
            <p id="save-status" style="font-size: 18px; margin-top: 10px;"></p>
        </div>

        <div class="card" id="characters-panel">
            <h2 style="color: #ffd700;" id="panel-title">Мои карточки</h2>
            <div id="characters-list" style="display: flex; flex-direction: column; gap: 20px; margin-top: 20px;"></div>
        </div>
    </div>

    <script src="app.js?v=22"></script>
</body>
</html>
